<line x1="55" y1="234" x2="816" y2="234" stroke="#dddddd" stroke-width="1"/>
<text class="tick" x="48" y="238" text-anchor="end" data-axis="y" data-v="0.6">0.6</text>
<line x1="55" y1="180" x2="816" y2="180" stroke="#dddddd" stroke-width="1"/>
<text class="tick" x="48" y="184" text-anchor="end" data-axis="y" data-v="0.8">0.8</text>
