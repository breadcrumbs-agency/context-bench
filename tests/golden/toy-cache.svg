<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="546" viewBox="0 0 840 546" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222222">
<title>toy: cache reuse against budget</title>
<rect width="840" height="546" fill="#ffffff"/>
<text x="24" y="28" font-size="16" font-weight="bold">toy: cache reuse against budget</text>
<text x="24" y="48" font-size="12" fill="#666666">Cache reuse: the share of the request's tokens that sit in the leading messages which the request</text>
<text x="24" y="64" font-size="12" fill="#666666">before also sent.</text>
<text x="24" y="80" font-size="12" fill="#666666">Dashed black line: full, the ceiling.</text>
