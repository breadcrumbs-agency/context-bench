<line x1="245.25" y1="396" x2="245.25" y2="400" stroke="#333333" stroke-width="1"/>
<text class="tick" x="245.25" y="414" text-anchor="middle" data-axis="x" data-v="100">100</text>
<line x1="625.75" y1="396" x2="625.75" y2="400" stroke="#333333" stroke-width="1"/>
<text class="tick" x="625.75" y="414" text-anchor="middle" data-axis="x" data-v="200">200</text>
<path class="axis" fill="none" stroke="#333333" stroke-width="1.2" d="M55 126L55 396L816 396"/>
<text x="435.5" y="436" text-anchor="middle" font-size="12">budget (tokens per request)</text>
<text x="14" y="261" transform="rotate(-90 14 261)" text-anchor="middle" font-size="12">cache reuse (share of request tokens, 0 to 1)</text>
<line class="ceiling" x1="55" y1="128.67" x2="816" y2="128.67" stroke="#222222" stroke-width="1.4" stroke-dasharray="5 4"><title>cache reuse 0.9901</title></line>
<text x="812" y="142.67" text-anchor="end" font-size="11">full (ceiling) 0.9901</text>
