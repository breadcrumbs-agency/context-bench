<line x1="625.75" y1="380" x2="625.75" y2="384" stroke="#333333" stroke-width="1"/>
<text class="tick" x="625.75" y="398" text-anchor="middle" data-axis="x" data-v="200">200</text>
<path class="axis" fill="none" stroke="#333333" stroke-width="1.2" d="M55 110L55 380L816 380"/>
<text x="435.5" y="420" text-anchor="middle" font-size="12">budget (tokens per request)</text>
<text x="14" y="245" transform="rotate(-90 14 245)" text-anchor="middle" font-size="12">cache reuse (share of request tokens, 0 to 1)</text>
<line class="ceiling" x1="55" y1="112.67" x2="816" y2="112.67" stroke="#222222" stroke-width="1.4" stroke-dasharray="5 4"><title>cache reuse 0.9901</title></line>
