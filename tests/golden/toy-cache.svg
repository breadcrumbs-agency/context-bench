<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222222">
<title>toy: cache reuse against budget</title>
