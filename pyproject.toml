[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bench"
version = "0.1.0"
description = "One stream, one meter, one board: context engines head to head, with open-source engines and sources drawn in by exact pins."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
contextbench = "contextbench.cli:main"

[tool.setuptools]
packages = ["contextbench"]
